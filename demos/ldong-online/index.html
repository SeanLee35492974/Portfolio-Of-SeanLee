<style>html,body{margin:0;background:#eaf5ff;}body{min-height:100vh;display:grid;place-items:start center}.ldong-online-demo{width:min(100%,1024px);overflow:hidden}.ldong-online-demo svg{display:block;width:100%;height:auto}@media (max-width:680px){body{display:block}.ldong-online-demo{width:100%}}</style>

<!--
  凌动ONLINE｜P1-P9 微信嵌套正式版 V13
  固定画布：1024 × 1820
  顺序：P1 欢迎 → P2 角色 → P3 花名 → P4 基地 → P5 任务 → P6 装备 → P7 玩家守则 → P8 组队作战 → P9 真正的主线
  P9：使用 P9-A / P9-B 两层大字遮罩；进入即显示第一段，再点击一次显示第二段
  切页：当前层使用独立整页透明命中层，点击后仅收起当前层一次
  兼容：仅使用基础 SVG / SMIL 与现代 href，不依赖脚本或旧式图片引用
  图片：保留现代 href；URL 中的 & 必须写作 &amp;
  防闪屏：每个图片层下方均有同页近似色不透明底板
  图片：P1-P9 原始视觉素材已按原顺序本地化配置
-->

		     ============================================================ -->

			<rect x="0" y="0" width="1024" height="1820" fill="#fae7c0" pointer-events="none"></rect>
			<image href="assets/p9.webp" x="0" y="0" width="1024" height="1820" preserveaspectratio="xMidYMid meet" pointer-events="none"></image>

			<!-- 第二段大字：价值观行动与使命 -->
			<rect x="63" y="306" width="898" height="548" rx="18" fill="#fff4d8" fill-opacity=".98" stroke="#1d5ca8" stroke-width="3" pointer-events="none"></rect>
			<text x="112" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="35" font-weight="700" fill="#154f96" pointer-events="none">真正的主线，是我们共同写下的：</text>
